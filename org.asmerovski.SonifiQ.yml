app-id: org.asmerovski.SonifiQ
runtime: org.kde.Platform
runtime-version: '6.7'
sdk: org.kde.Sdk
command: sonifiq
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --share=network
  - --filesystem=home

modules:
  - name: sonifiq
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: dir
        path: .
